<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مثال على صفحة تفاعلية</title>
    <!-- تضمين مكتبة Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تضمين الخطوط وأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        /* تأثير النبض للنقاط التفاعلية */
        @keyframes pulse-custom {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .hotspot-pulse {
            animation: pulse-custom 2s infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- حاوية الخلفية التفاعلية -->
    <div class="relative w-full max-w-4xl h-[500px] bg-gradient-to-br from-indigo-900 via-slate-800 to-slate-900 rounded-2xl shadow-2xl overflow-hidden border border-slate-700 flex items-center justify-center">
        
        <!-- خلفية جمالية أو صورة تعبيرية -->
        <div class="absolute inset-0 opacity-25 bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:16px_16px]"></div>

        <div class="absolute top-6 text-center z-10">
            <h1 class="text-2xl md:text-3xl font-bold mb-2">استكشف المحتوى التفاعلي</h1>
            <p class="text-slate-400 text-sm">انقر على النقاط أدناه لمعرفة التفاصيل</p>
        </div>

        <!-- النقاط التفاعلية (Hotspots) يتم توضيعها بالنسب المئوية -->
        
        <!-- النقطة الأولى -->
        <div class="absolute top-1/3 right-1/4">
            <button onclick="openModal('الميزة الأولى', 'هذه النافذة تظهر تفاصيل العنصر الأول عند النقر عليه تماماً مثل التصاميم التفاعلية. يمكنك إضافة نصوص، صور، أو حتى روابط.', 'fa-star', 'text-amber-400')" 
                    class="hotspot-pulse w-10 h-10 bg-blue-600 hover:bg-blue-500 rounded-full flex items-center justify-center shadow-lg transition transform hover:scale-110 cursor-pointer">
                <i class="fa-solid fa-star text-white"></i>
            </button>
            <span class="absolute top-12 right-1/2 translate-x-1/2 bg-slate-800/80 backdrop-blur text-xs px-2 py-1 rounded whitespace-nowrap border border-slate-600">الميزة الأولى</span>
        </div>

        <!-- النقطة الثانية -->
        <div class="absolute bottom-1/3 left-1/3">
            <button onclick="openModal('قسم الخدمات', 'من خلال هذا القسم يمكنك عرض تفاصيل الخدمات أو المنتجات التي تقدمها بطريقة بصرية جذابة للمستخدمين.', 'fa-wand-magic-sparkles', 'text-purple-400')" 
                    class="hotspot-pulse w-10 h-10 bg-purple-600 hover:bg-purple-500 rounded-full flex items-center justify-center shadow-lg transition transform hover:scale-110 cursor-pointer">
                <i class="fa-solid fa-wand-magic-sparkles text-white"></i>
            </button>
            <span class="absolute top-12 right-1/2 translate-x-1/2 bg-slate-800/80 backdrop-blur text-xs px-2 py-1 rounded whitespace-nowrap border border-slate-600">الخدمات</span>
        </div>

        <!-- النقطة الثالثة -->
        <div class="absolute top-1/2 left-1/4">
            <button onclick="openModal('تواصل معنا', 'يمكنك ربط هذا الزر بصفحة اتصل بنا، أو إظهار نموذج رسائل تفاعلي للمستخدم داخل نفس الصفحة.', 'fa-envelope', 'text-emerald-400')" 
                    class="hotspot-pulse w-10 h-10 bg-emerald-600 hover:bg-emerald-500 rounded-full flex items-center justify-center shadow-lg transition transform hover:scale-110 cursor-pointer">
                <i class="fa-solid fa-envelope text-white"></i>
            </button>
            <span class="absolute top-12 right-1/2 translate-x-1/2 bg-slate-800/80 backdrop-blur text-xs px-2 py-1 rounded whitespace-nowrap border border-slate-600">تواصل معنا</span>
        </div>

    </div>

    <!-- نافذة منبثقة تفاعلية (Modal) -->
    <div id="interactiveModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50 transition-opacity">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all scale-95" id="modalContentBox">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <div id="modalIconBg" class="w-10 h-10 rounded-xl bg-slate-700 flex items-center justify-center">
                        <i id="modalIcon" class="fa-solid text-xl"></i>
                    </div>
                    <h3 id="modalTitle" class="text-xl font-bold"></h3>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <p id="modalBody" class="text-slate-300 leading-relaxed mb-6"></p>
            <div class="flex justify-end">
                <button onclick="closeModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-sm font-semibold transition">
                    إغلاق
                </button>
            </div>
        </div>
    </div>

    <!-- سكربت التحكم في التفاعل -->
    <script>
        function openModal(title, text, iconClass, iconColorClass) {
            const modal = document.getElementById('interactiveModal');
            const modalBox = document.getElementById('modalContentBox');
            
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = text;
            
            const icon = document.getElementById('modalIcon');
            icon.className = `fa-solid ${iconClass} ${iconColorClass}`;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modalBox.classList.remove('scale-95');
                modalBox.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('interactiveModal');
            const modalBox = document.getElementById('modalContentBox');
            
            modalBox.classList.remove('scale-100');
            modalBox.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 150);
        }

        // إغلاق النافذة عند النقر خارجها
        window.onclick = function(event) {
            const modal = document.getElementById('interactiveModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
